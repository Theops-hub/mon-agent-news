name: Feed Health Check

# Vérifie que chaque flux RSS de config/sources.json répond, parse, et renvoie
# des articles datés. collect.ts avale les flux morts en silence : sans ce
# check, une source disparue appauvrit le digest sans que personne ne le voie.
# Sert aussi à valider une nouvelle source avant de la garder.

on:
  schedule:
    # Tous les lundis à 06:41 UTC, une demi-heure après le healthcheck LLM
    # pour ne pas mélanger les deux causes d'échec dans les notifications.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check RSS feeds
        run: npm run feed-health
