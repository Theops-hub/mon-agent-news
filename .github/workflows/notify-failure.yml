name: Notify on Failure

# Se déclenche après échec OU annulation (timeout) de Daily Collection ou Daily Digest.
# Ouvre une issue → GitHub t'envoie un email natif. Filet de sécurité final
# au cas où même le mode dégradé (envoi d'email Resend) aurait planté.
# Le cas "cancelled" est couvert depuis le 11 juin 2026 : les timeouts des
# 8-10 juin terminaient en "cancelled" et passaient sous le radar.

on:
  workflow_run:
    workflows: ["Daily News Collection", "Daily Digest", "Monthly Digest", "LLM Health Check", "Catch-up Digest"]
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `⚠️ Échec workflow : ${run.name} (${run.head_branch})`;
            const body = [
              `Le workflow **${run.name}** a échoué.`,
              ``,
              `- Conclusion : ${run.conclusion}`,
              `- Date : ${run.created_at}`,
              `- Run : ${run.html_url}`,
              ``,
              `Pense à vérifier ce qui s'est passé (quota API, panne, etc.).`,
            ].join("\n");

            // Évite le spam : si une issue identique est déjà ouverte, on commente plutôt.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "agent-failure",
              per_page: 50,
            });
            // startsWith et non égalité stricte : le titre est enrichi d'un
            // compteur (« — N échecs depuis le … ») dès la 2e occurrence, et une
            // égalité stricte rouvrirait une issue neuve à chaque échec.
            const sameTitle = existing.find((i) => i.title.startsWith(title));
            if (sameTitle) {
              // Une panne qui dure doit devenir plus visible, pas moins. Le
              // healthcheck LLM a échoué 7 semaines d'affilée en juillet-août 2026
              // sans que personne ne réagisse : chaque échec n'ajoutait qu'un
              // « Nouvel échec : <url> » anonyme au fil d'une issue déjà lue.
              // On compte les récurrences et on renomme l'issue pour que le
              // compteur apparaisse dans l'objet de l'email GitHub.
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sameTitle.number,
                per_page: 100,
              });
              // On ne compte que nos propres comptes rendus : une réponse humaine
              // sur l'issue ne doit pas gonfler le compteur d'échecs.
              const previous = comments.filter((c) =>
                (c.body || "").includes("échec consécutif")
              ).length;
              const streak = previous + 2; // +1 pour l'issue initiale, +1 pour cet échec
              const since = new Date(sameTitle.created_at).toISOString().slice(0, 10);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sameTitle.number,
                body: [
                  `**${streak}e échec consécutif** de \`${run.name}\` (premier échec le ${since}).`,
                  ``,
                  `- Conclusion : ${run.conclusion}`,
                  `- Run : ${run.html_url}`,
                  ``,
                  streak >= 3
                    ? `⚠️ Cette panne dure depuis ${since}. Ce n'est plus un incident passager : il faut traiter la cause (clé API morte, modèle retiré, quota).`
                    : `Vérifier la cause (quota API, panne, modèle déprécié).`,
                ].join("\n"),
              });
              // Le compteur dans le titre force GitHub à ré-notifier avec un
              // objet d'email qui change — impossible à confondre avec du bruit.
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sameTitle.number,
                title: `${title} — ${streak} échecs depuis le ${since}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["agent-failure"],
              });
            }
